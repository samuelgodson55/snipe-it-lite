# =============================================================================
# render.yaml
# -----------------------------------------------------------------------------
# Render "Blueprint" (Infrastructure as Code) for Snipe-IT Lite. Deploys the
# exact same three-tier shape described in README.md's "Deploying Across
# Environments" section -- a Postgres database, a private FastAPI backend,
# and a public nginx reverse-proxy/frontend -- with zero manual dashboard
# copy-pasting required. See:
#   https://render.com/docs/blueprint-spec
#   https://render.com/docs/infrastructure-as-code
#
# HOW TO USE
# -----------------------------------------------------------------------------
# 1. Push this file (at the repo root) to GitHub/GitLab/Bitbucket.
# 2. In the Render Dashboard: New -> Blueprint -> connect this repo.
# 3. Render reads this file, provisions all three resources below, and wires
#    BACKEND_HOST/BACKEND_PORT and DATABASE_URL together automatically via
#    `fromService`/`fromDatabase` -- no manual "open Connect -> Internal tab
#    and paste the hostname" step like the README's older manual checklist
#    describes. That checklist is still worth reading for the *concepts*
#    (same-region requirement, why the backend is a private service, etc.)
#    even though this file automates the mechanical part.
# 4. RESOLVER_IP is intentionally left UNSET for the frontend service below --
#    nginx/docker-entrypoint.d/15-detect-resolver-ip.sh auto-detects the
#    correct internal DNS resolver from the container's own /etc/resolv.conf
#    at boot, since Render (unlike Docker Compose) doesn't publish one fixed,
#    documented address to hardcode here. See that script for the full
#    reasoning.
# 5. JWT_SECRET_KEY and SUPER_ADMIN_PASSWORD are both auto-generated by
#    Render (`generateValue: true`) -- you never need to invent or store
#    either one yourself. Find the generated SUPER_ADMIN_PASSWORD in the
#    Render dashboard's Environment tab if you need to log in as the
#    hardcoded Super Admin (see backend/config.py's SUPER_ADMIN_* docstring).
# =============================================================================

databases:
  # Managed Postgres. `property: connectionString` (referenced below) gives
  # the backend a ready-to-use `postgresql://...` URL -- no manual
  # host/port/user/password assembly needed.
  - name: snipeit-lite-db
    databaseName: asset_db
    user: snipeit
    plan: free
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------
  # Backend: FastAPI, as a PRIVATE service (no public onrender.com URL --
  # matches docker-compose.yml's "backend has no host `ports:` mapping"
  # setup). Only the frontend/nginx service below can reach it, over
  # Render's private network.
  # ---------------------------------------------------------------------
  - type: pserv
    name: snipeit-lite-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon # Must match the frontend service's region -- see below.
    envVars:
      # PORT is what Render uses to know which port to route to (surfaced
      # to the frontend via `property: port` below). Must match the actual
      # port uvicorn binds -- see backend/Dockerfile's CMD.
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: snipeit-lite-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true # Random 256-bit value -- comfortably over the
                            # 32-char minimum config.py enforces once
                            # ENVIRONMENT=production (see config.py's
                            # startup check).
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: 12
      # Same-origin in normal use (the browser only ever talks to the
      # frontend's own origin, which proxies /api/* through server-side --
      # see nginx/default.conf.template) -- this mostly matters as
      # defense-in-depth for anyone hitting the backend directly. Points at
      # the frontend service's own public URL, which Render exposes to it
      # as RENDER_EXTERNAL_URL.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: snipeit-lite-frontend
          envVarKey: RENDER_EXTERNAL_URL
      # Demo/staging-friendly defaults matching docker-compose.yml. Flip
      # both to "false" for a real production deployment with real data --
      # see README.md's "Database Migrations" section for running
      # `alembic upgrade head` as an explicit deploy step instead.
      - key: AUTO_INIT_DB
        value: true
      - key: AUTO_SEED_DEMO_DATA
        value: true
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: LOGIN_RATE_LIMIT_MAX
        value: 5
      - key: LOGIN_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      # SECURITY: this is a real cloud deployment reachable from the public
      # internet, so /docs, /redoc, and /openapi.json are disabled here --
      # see config.py's ENABLE_API_DOCS docstring for the full reasoning.
      # Must be kept in sync with the frontend service's own
      # ENABLE_API_DOCS below (nginx enforces the same block as a second,
      # independent layer -- see nginx/default.conf.template).
      - key: ENABLE_API_DOCS
        value: false
      # Hardcoded Super Admin (root account) -- see backend/config.py's
      # SUPER_ADMIN_* docstring and .env.example. ENVIRONMENT=production
      # above means config.py's startup check REQUIRES this to be set to a
      # real value or the backend refuses to boot -- generateValue: true
      # satisfies that automatically, the same way it does for
      # JWT_SECRET_KEY. Find the generated value in the Render dashboard
      # (Environment tab) if you need to log in as this account.
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      - key: SUPER_ADMIN_NAME
        value: Super Admin
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true

  # ---------------------------------------------------------------------
  # Frontend: the nginx reverse proxy + static site (frontend/*.html, js/*)
  # built from nginx/Dockerfile. This is the ONLY publicly reachable piece
  # -- matches docker-compose.yml's `ports: - "8080:80"` on the `frontend`
  # service being the sole host-published port.
  # ---------------------------------------------------------------------
  - type: web
    name: snipeit-lite-frontend
    runtime: docker
    dockerfilePath: nginx/Dockerfile
    dockerContext: . # Repo root -- Dockerfile also COPYs frontend/ from here.
    plan: starter
    region: oregon # Must match the backend service's region -- private
                   # networking (and therefore this whole setup) only
                   # works within a single Render region.
    healthCheckPath: /
    envVars:
      # Render assigns/injects its own PORT for web services; nginx's
      # `ENV PORT=80` default in nginx/Dockerfile gets overridden by that
      # automatically -- nothing to set here (see README.md's Render
      # section for more on this).
      - key: BACKEND_HOST
        fromService:
          type: pserv
          name: snipeit-lite-backend
          property: host
      - key: BACKEND_PORT
        fromService:
          type: pserv
          name: snipeit-lite-backend
          property: port
      # RESOLVER_IP deliberately omitted -- see the top-of-file note and
      # nginx/docker-entrypoint.d/15-detect-resolver-ip.sh.
      # SECURITY: must match the backend service's own ENABLE_API_DOCS
      # above -- this is nginx's independent copy of the same gate (blocks
      # /docs, /redoc, /openapi.json before the request ever reaches the
      # backend at all -- see default.conf.template's docs location block).
      - key: ENABLE_API_DOCS
        value: false
